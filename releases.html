<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillness Releases</title>
<meta name="description" content="Every version of Stillness for Windows, with change notes and installer downloads.">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
/* Releases page only; tokens and header/footer chrome live in shared/base.css. */
main { padding: 64px 0 40px; }
main .wrap { max-width: 820px; }
.kicker { font-family: var(--font-mono); font-size: .78rem; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.05; letter-spacing: -.04em; font-weight: 800; margin: 10px 0 12px; }
:lang(ko) h1, :lang(ja) h1 { letter-spacing: -.02em; }
.sub { color: var(--muted); font-size: 1.05rem; margin: 0 0 36px; max-width: 620px; }
.os-tabs { display: inline-flex; gap: 4px; padding: 4px; margin: 0 0 20px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line-2); }
.os-tabs button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; font: inherit; font-size: .9rem; font-weight: 600; color: var(--muted); padding: 8px 16px; border-radius: 9px; cursor: pointer; }
.os-tabs button:hover { color: var(--fg); }
.os-tabs button[aria-selected="true"] { background: var(--btn-bg); color: var(--btn-fg); }
.os-tabs svg { width: 16px; height: 16px; }
.rel-list { display: grid; gap: 14px; }
.rel-hint, .rel-state { color: var(--faint); font-size: .88rem; margin: 0 0 4px; }
.rel-state { padding: 32px 0; text-align: center; font-size: .95rem; color: var(--muted); }
.rel-state p { margin: 0 0 14px; }
.rel { border-radius: var(--radius-lg); padding: 22px 24px; }
.rel.latest { box-shadow: var(--panel-shadow), 0 0 0 1.5px var(--accent) inset; }
.rel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.rel h2 { margin: 0; font-size: 1.35rem; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.pill { font-size: .72rem; font-weight: 700; letter-spacing: .02em; padding: 3px 9px; border-radius: 99px; background: var(--accent); color: var(--on-accent); }
.rel time { color: var(--faint); font-size: .86rem; }
.rel .btn svg { width: 16px; height: 16px; }
.rel ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.rel li { display: flex; gap: 10px; align-items: baseline; color: var(--muted); font-size: .95rem; }
.rel li code { font-family: var(--font-mono); font-size: .85em; background: var(--line); padding: 1px 5px; border-radius: 4px; }
.tag { flex: none; font-size: .7rem; font-weight: 700; padding: 2px 7px; border-radius: 5px; letter-spacing: .02em; }
.tag.new { color: var(--accent); background: var(--ic-bg); border: 1px solid var(--ic-border); }
.tag.fix { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 28%, transparent); }
.rel-empty { margin: 14px 0 0; color: var(--faint); font-size: .92rem; }
.rel-file { margin: 14px 0 0; font-family: var(--font-mono); font-size: .76rem; color: var(--faint); overflow-wrap: anywhere; }
@media (max-width: 640px) {
  main { padding-top: 40px; }
  .rel { padding: 18px; }
  .rel-head .btn { width: 100%; justify-content: center; }
}
</style>
<script>
  // Apply the saved theme before first paint so dark visitors don't see a light flash.
  try { if (localStorage.getItem("stillness.theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
<script src="shared/i18n.js" defer></script>
<script src="shared/theme.js" defer></script>
<script src="shared/release.js" defer></script>
<script src="shared/releases.js" defer></script>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="index.html"><img src="assets/icon.png" alt="">Stillness</a>
    <nav class="links">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="index.html#features" data-i18n="nav.features">Features</a>
      <a href="index.html#faq" data-i18n="nav.faq">FAQ</a>
    </nav>
    <div class="lang" data-lang-switch></div>
    <button type="button" class="theme-btn" data-theme-toggle data-i18n-label="theme.toggle">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <a class="btn small" data-download href="#" data-i18n="nav.download">Download</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="kicker" data-tab-platform>Windows 10 / 11 · x64</div>
    <h1 data-i18n="rel.title">Releases</h1>
    <p class="sub" data-i18n="rel.sub"></p>
    <div class="os-tabs" role="tablist">
      <button type="button" role="tab" data-os-tab="windows"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5 10 4.5v7H3zM11 4.3 21 3v8.5H11zM3 12.5h7v7L3 18.5zM11 12.5h10V21l-10-1.4z"/></svg>Windows</button>
      <button type="button" role="tab" data-os-tab="macos"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.5-1-2.5-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>macOS</button>
    </div>
    <div class="rel-list" data-release-list aria-live="polite"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span class="brand"><img src="assets/icon.png" alt="">Stillness</span>
    <span data-i18n="footer.tag"></span>
    <a class="r" href="index.html" data-i18n="nav.home"></a>
  </div>
</footer>
</body>
</html>
